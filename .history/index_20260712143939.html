<!doctype html>
<html lang="en" class="bg-[#0F0F0F]">
  <head>
    <!-- Character Encoding & Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>Arpit Tiwari - AI Portfolio & Twin | Full Stack Developer</title>
    <meta
      name="description"
      content="Arpit Tiwari's professional portfolio showcasing AI projects, full-stack development expertise, and specialized skills in modern web technologies. Explore projects, timeline, and technical proficiency."
    />
    <meta
      name="keywords"
      content="Arpit Tiwari, AI portfolio, full stack developer, web development, React, TypeScript, Python, machine learning, portfolio website"
    />
    <meta name="author" content="Arpit Tiwari" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />
    <meta name="language" content="English" />
    <meta name="revisit-after" content="7 days" />
    <meta name="theme-color" content="#D4AF37" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://arpit-portfolio.com" />

    <!-- Open Graph Tags (Social Media) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Arpit Tiwari - AI Portfolio & Twin | Full Stack Developer"
    />
    <meta
      property="og:description"
      content="Explore Arpit Tiwari's professional portfolio with AI projects, full-stack development work, and technical expertise."
    />
    <meta property="og:url" content="https://arpit-portfolio.com" />
    <meta property="og:site_name" content="Arpit Tiwari Portfolio" />
    <meta
      property="og:image"
      content="https://arpit-portfolio.com/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arpit Tiwari - AI Portfolio & Twin" />
    <meta
      name="twitter:description"
      content="Explore my AI projects, full-stack development work, and technical expertise."
    />
    <meta
      name="twitter:image"
      content="https://arpit-portfolio.com/og-image.jpg"
    />
    <meta name="twitter:creator" content="@arpit_tiwari" />

    <!-- Google Site Verification -->
    <meta
      name="google-site-verification"
      content="g-cSb0ae_SVcrHa3Gpy6Tg-H4FZgb2waO-5qL7X6uTw"
    />

    <!-- Additional Meta Tags -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Arpit Tiwari" />
    <!-- Elegant serif and clean display fonts for the Sophisticated Dark theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Fira+Code:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Apply gorgeous premium fonts */
      .font-serif {
        font-family: "Playfair Display", Georgia, serif;
      }
      .font-sans {
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
      }
      .font-mono {
        font-family: "Fira Code", monospace;
      }
    </style>

    <!-- JSON-LD Structured Data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Arpit Tiwari",
        "url": "https://arpit-portfolio.com",
        "image": "https://arpit-portfolio.com/profile-image.jpg",
        "sameAs": [
          "https://linkedin.com/in/arpit-tiwari",
          "https://github.com/arpit-tiwari",
          "https://twitter.com/arpit_tiwari"
        ],
        "jobTitle": "Full Stack Developer",
        "worksFor": {
          "@type": "Organization",
          "name": "Independent"
        },
        "knowsAbout": [
          "Web Development",
          "Artificial Intelligence",
          "React",
          "TypeScript",
          "Python",
          "Machine Learning",
          "Full Stack Development"
        ],
        "description": "AI-focused full stack developer with expertise in modern web technologies and machine learning projects"
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Arpit Tiwari Portfolio",
        "url": "https://arpit-portfolio.com",
        "description": "Professional portfolio showcasing AI projects and full-stack development expertise"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
